kind = "web"
previewPath = "/campaign/"
title = "Cinematic Campaign"
version = "1.0.0"
id = "artifacts/campaign"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/campaign/" ]
localPort = 23001

[services.development]
run = "pnpm --filter @workspace/campaign run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campaign", "run", "build" ]
publicDir = "artifacts/campaign/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23001"
BASE_PATH = "/campaign/"
